    <!-- Favicon - заглушка. -->
    <link id="app-icon" rel="icon" href="data:,"> 
    
    <script>
      // Apply the saved theme before the first paint (no light flash in the dark theme).
      (function () {
        var t = 'light';
        try { if (localStorage.getItem('theme') === 'dark') t = 'dark'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="stylesheet" href="input.css">
  </head>
