name: Build make_first_flash tool

# Builds scripts/make_first_flash_probe for Windows, Linux and macOS.
# Put this file into  .github/workflows/  in the ROOT of the repository
# (next to the existing codeql.yml, update.yml) - do not replace them.

on:
  workflow_dispatch:
  push:
    tags: ["tool-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: make_first_flash.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: make_first_flash
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: make_first_flash
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: make_first_flash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: scripts/make_first_flash_probe
    steps:
      - uses: actions/checkout@v4

      - name: Install libudev (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: make_first_flash-${{ matrix.target }}
          path: scripts/make_first_flash_probe/target/${{ matrix.target }}/release/${{ matrix.bin }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/tool-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Pack archives
        run: |
          cd dist
          for d in make_first_flash-*; do
            chmod +x "$d"/make_first_flash*
            (cd "$d" && zip -q "../$d.zip" *)
          done
          ls -l

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          prerelease: true

      - name: Check out main to update the archives
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Replace the archives in Proshivka/First_flash
        run: |
          set -e
          dest=repo/Proshivka/First_flash
          find "$dest" -type f -name 'make_first_flash-*.zip' -delete
          mkdir -p "$dest/Windows" "$dest/Linux" "$dest/MAC/Mac_Intel" "$dest/MAC/Mac_M1_M2_M3_M4_Apple"
          cp dist/make_first_flash-x86_64-pc-windows-msvc.zip   "$dest/Windows/"
          cp dist/make_first_flash-x86_64-unknown-linux-gnu.zip "$dest/Linux/"
          cp dist/make_first_flash-x86_64-apple-darwin.zip      "$dest/MAC/Mac_Intel/"
          cp dist/make_first_flash-aarch64-apple-darwin.zip     "$dest/MAC/Mac_M1_M2_M3_M4_Apple/"
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Proshivka/First_flash
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "First_flash: update make_first_flash archives to ${GITHUB_REF_NAME}"
          git pull --rebase origin main
          git push origin HEAD:main
