name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: make_first_flash.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: make_first_flash
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: make_first_flash
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: make_first_flash
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install libudev (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: make_first_flash-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
